<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Привіт! — Екотолока</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/layout.css">
</head>
<body>
<header class="site-header"><div class="container site-header__inner">
  <a href="index.html" class="logo"><span class="logo__mark">Е</span><span>Екотолока</span></a>
</div></header>

<main>
  <section class="section">
    <div class="container container--narrow">
      <div class="card" style="padding: var(--space-8); max-width: 480px; margin: 0 auto">
        <div style="font-size: 3rem; text-align: center; margin-bottom: var(--space-3)">👋</div>
        <h1 style="text-align: center; margin-bottom: var(--space-3)">Як тебе звати?</h1>
        <p class="muted center" style="margin-bottom: var(--space-6)">Одне поле — і готово. Решту заповниш, коли захочеш.</p>

        <form data-demo-form="profile.html" class="stack">
          <div class="field">
            <label class="field__label sr-only" for="name">Ім'я</label>
            <input class="input" type="text" id="name" required placeholder="Твоє ім'я" autofocus style="font-size: 1.25rem; text-align:center; padding: var(--space-4)">
          </div>
          <button type="submit" class="btn btn--primary btn--block btn--lg">Готово</button>
          <a href="profile.html" class="btn btn--ghost btn--block">Пропустити — заповню пізніше</a>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer"><div class="container"><div class="footer-bottom" style="padding:0"><span>© 2026 ГО «Екотолока».</span></div></div></footer>
<script src="js/main.js"></script>
</body>
</html>
